# A pedido (pestaña Actions > Fuentes > Run workflow): vuelve a descargar las fuentes públicas, las compara con
# datos/ y rehace la síntesis de XGM2019e. No se ejecuta en cada envío porque depende de servicios externos
# (GEOCATMIN, AWS e ICGEM) y descarga 420 MB de coeficientes.
name: Fuentes

on:
  workflow_dispatch:

jobs:
  fuentes:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5

      - name: Crear el entorno con las versiones exactas de uv.lock
        run: uv sync --locked

      - name: Descargar el DEM y los coeficientes de ICGEM y compararlos con datos/
        run: uv run python scripts/descargar_datos.py --fuentes dem icgem

      - name: Síntesis armónica de XGM2019e y comparación con datos/
        run: uv run python scripts/sintesis_xgm2019e.py

      # El servidor de GEOCATMIN no envía su certificado intermedio: Windows lo completa por su cuenta, pero en
      # Linux la conexión segura puede fallar. Este paso informa sin detener el flujo (la comparación con GEOCATMIN
      # se verificó desde Windows; ver datos/LEEME.md).
      - name: Descargar las capas de GEOCATMIN y compararlas con datos/
        continue-on-error: true
        run: uv run python scripts/descargar_datos.py --fuentes geocatmin
